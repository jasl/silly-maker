# SPDX-License-Identifier: MIT
# Publishes the composed static site (documentation + playable Cat Cafe
# demo) to GitHub Pages. Trigger it manually from the Actions tab, or push
# to main after uncommenting the push trigger.
#
# One-time repository setup: Settings -> Pages -> Source: "GitHub Actions".
name: Deploy site to GitHub Pages

on:
  workflow_dispatch:
  # push:
  #   branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install dependencies
        run: deno install
      - name: Build site (docs + Cat Cafe demo)
        run: deno task site:build
        env:
          # Project sites live under https://<owner>.github.io/<repo>/.
          SITE_BASE: /${{ github.event.repository.name }}/
          # Absolutizes og:image/og:url in the game page for crawlers.
          SITE_ORIGIN: https://${{ github.repository_owner }}.github.io
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
