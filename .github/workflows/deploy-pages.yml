# SPDX-License-Identifier: MIT
# Publishes the composed static site (documentation + playable Cat Cafe and
# SillyOS Creator Preview applications) to GitHub Pages. Push deployment intentionally remains
# disabled; if enabled later, the same-commit CI quality and prebuilt-smoke
# gates must succeed before this workflow may build or deploy.
#
# One-time repository setup: Settings -> Pages -> Source: "GitHub Actions".
name: Deploy site to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: latest
      - name: Install dependencies
        run: deno ci
      - name: Build site (docs + playable examples)
        run: deno task site:build
        env:
          # Project sites live under https://<owner>.github.io/<repo>/.
          SITE_BASE: /${{ github.event.repository.name }}/
          # Absolutizes og:image/og:url in the game page for crawlers.
          SITE_ORIGIN: https://${{ github.repository_owner }}.github.io
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
